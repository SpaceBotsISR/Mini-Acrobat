safety_node:
  ros__parameters:
    # Disarm when no GCS heartbeat arrives for this long [ms].
    heartbeat_timeout_ms: 300
    # While armed, a setpoint older than this becomes zero throttle [ms].
    setpoint_timeout_ms: 300
    # Rate of /motor_cmd and of the watchdog evaluation [Hz].
    output_rate_hz: 50.0
    # Consecutive healthy heartbeats required before /safety/arm is accepted.
    min_heartbeats_to_arm: 5
    # /safety/arm is refused if any |throttle| is above this.
    arm_zero_threshold: 0.02
